<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recursion Realm</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🐉 Recursion Realm</h1>
    <p class="tagline">Battle monsters. Power your attacks with recursion &amp; DP.</p>
    <button id="audiobtn" title="Toggle sound">🔊</button>
  </header>

  <main id="main">
    <!-- Menu / story / battle screens -->
    <div id="app"><!-- injected by game.js --></div>

    <!-- Overworld -->
    <div id="stage" class="hidden">
      <canvas id="game" width="480" height="384"></canvas>
      <div id="dialogue" class="hidden"></div>
      <div id="partybar">Party: (empty)</div>
      <div id="controls-hint">Move: WASD / Arrows &nbsp;·&nbsp; Interact: E / Space</div>
    </div>
  </main>

  <footer>
    <div id="progress"></div>
  </footer>

  <div id="fade"></div>

  <script src="src/audio.js"></script>
  <script src="src/data.js"></script>
  <script src="src/game.js"></script>
  <script src="src/world.js"></script>
</body>
</html>
