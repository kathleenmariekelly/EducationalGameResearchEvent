<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Code Tower — Learn to Code</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #1a1f36;
    --panel2: #232a4a;
    --accent: #5cd6c0;
    --accent2: #ffb347;
    --danger: #ff5d73;
    --good: #6bd968;
    --text: #e8ecff;
    --muted: #8b93b8;
    --common: #b8c0e0;
    --rare: #4fa3ff;
    --epic: #c77dff;
  }
  * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { margin:0; background: radial-gradient(circle at 50% -10%, #1c2244, var(--bg)); color: var(--text); min-height:100vh; }
  #app { max-width: 940px; margin: 0 auto; padding: 20px; }
  h1 { text-align:center; letter-spacing:1px; margin:8px 0; }
  .sub { text-align:center; color: var(--muted); margin-bottom:18px; }

  .statusbar { display:flex; justify-content:space-between; align-items:center; background:var(--panel); border-radius:12px; padding:12px 16px; margin-bottom:16px; }
  .stage-tag { font-weight:bold; color:var(--accent); }
  .hp-wrap { flex:1; margin:0 14px; }
  .hp-label { font-size:12px; color:var(--muted); margin-bottom:2px; display:flex; justify-content:space-between; }
  .bar { height:14px; background:#0c0f1c; border-radius:8px; overflow:hidden; }
  .bar > span { display:block; height:100%; transition:width .4s ease; }
  .enemy-bar > span { background:linear-gradient(90deg, var(--danger), #ff9d6e); }
  .player-bar > span { background:linear-gradient(90deg, var(--good), var(--accent)); }
  .shield-tag { color:#7ec8ff; font-weight:bold; }

  .panel { background:var(--panel); border-radius:12px; padding:18px; margin-bottom:16px; }

  .enemy { text-align:center; padding:16px; margin-bottom:8px; }
  .enemy .emoji { font-size:56px; }
  .enemy .name { font-size:20px; font-weight:bold; }
  .enemy .topic { color:var(--muted); font-size:13px; }

  .question { font-size:17px; font-weight:600; margin-bottom:6px; }
  .code { background:#0c0f1c; border:1px solid #2a3160; border-radius:8px; padding:10px 12px; font-family:'Consolas',monospace; font-size:14px; white-space:pre; overflow-x:auto; margin:8px 0; color:#d8e0ff; }
  .qhint { color:var(--accent2); font-size:14px; margin-bottom:12px; }
  .options { display:grid; gap:10px; }
  .opt { text-align:left; padding:12px 14px; border-radius:10px; cursor:pointer; background:var(--panel2); border:2px solid transparent; color:var(--text); font-size:15px; transition:.15s; }
  .opt:hover { border-color:var(--accent); }
  .opt.selected { border-color:var(--accent); background:#2b3566; }
  .opt.correct { border-color:var(--good); background:#234a2b; }
  .opt.wrong { border-color:var(--danger); background:#4a2330; }
  .opt.missed { border-color:var(--accent2); }

  .cards { display:flex; gap:10px; flex-wrap:wrap; margin-top:4px; }
  .card { flex:1 1 150px; background:linear-gradient(160deg,#2a3160,#1a1f36); border:2px solid #3a4478; border-radius:12px; padding:12px; cursor:pointer; transition:.15s; min-width:140px; position:relative; }
  .card:hover { transform:translateY(-3px); }
  .card .cname { font-weight:bold; }
  .card .cdesc { font-size:12px; color:var(--muted); margin-top:4px; }
  .card .rarity { position:absolute; top:8px; right:10px; font-size:10px; text-transform:uppercase; letter-spacing:1px; font-weight:bold; }
  .card.common { border-color:#3a4478; } .card.common .rarity { color:var(--common); }
  .card.rare   { border-color:var(--rare); box-shadow:0 0 8px rgba(79,163,255,.3);} .card.rare .rarity { color:var(--rare); }
  .card.epic   { border-color:var(--epic); box-shadow:0 0 12px rgba(199,125,255,.45);} .card.epic .rarity { color:var(--epic); }
  .card.draft { flex:1 1 210px; text-align:center; padding:22px 14px; }
  .card.draft:hover { transform:translateY(-6px); }
  .card.draft .cname { font-size:16px; }

  /* ---- Fanned hand: cards look held by an invisible hand at the bottom ---- */
  .hand-fan {
    position: relative;
    height: 190px;
    margin: 28px auto 6px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    perspective: 900px;
  }
  .hand-card {
    position: absolute;
    bottom: 0;
    width: 150px;
    min-height: 130px;
    padding: 14px 12px 12px;
    border-radius: 14px;
    background: linear-gradient(160deg,#2a3160,#141a30);
    border: 2px solid #3a4478;
    box-shadow: 0 10px 22px rgba(0,0,0,.45);
    cursor: pointer;
    transform-origin: bottom center;   /* pivot at the invisible hand */
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    text-align: left;
  }
  .hand-card .cname { font-weight:bold; font-size:14px; }
  .hand-card .cdesc { font-size:11px; color:var(--muted); margin-top:6px; line-height:1.35; }
  .hand-card .rarity { position:absolute; top:8px; right:10px; font-size:9px; text-transform:uppercase; letter-spacing:1px; font-weight:bold; }
  .hand-card.common { border-color:#4a5590; } .hand-card.common .rarity { color:var(--common); }
  .hand-card.rare   { border-color:var(--rare); box-shadow:0 10px 22px rgba(0,0,0,.45), 0 0 10px rgba(79,163,255,.35); } .hand-card.rare .rarity { color:var(--rare); }
  .hand-card.epic   { border-color:var(--epic); box-shadow:0 10px 22px rgba(0,0,0,.45), 0 0 14px rgba(199,125,255,.5); } .hand-card.epic .rarity { color:var(--epic); }
  /* base transform comes from per-card CSS vars so hover can keep position */
  .hand-card {
    transform: translateX(var(--tx,0)) translateY(var(--ty,0)) rotate(var(--rot,0deg)) scale(1);
  }
  .hand-card:hover {
    /* stay in place (keep --tx/--ty/--rot) and just grow a little */
    transform: translateX(var(--tx,0)) translateY(var(--ty,0)) rotate(var(--rot,0deg)) scale(1.06) !important;
    z-index: 1000 !important;
    box-shadow: 0 12px 24px rgba(0,0,0,.5);
    filter: brightness(1.1);
  }
  .hand-card.focused { filter:brightness(1.12); }
  .hand-empty { color:var(--muted); text-align:center; padding:20px 0; }
  .hand-nav {
    position:absolute; bottom:44px; z-index:1001;
    width:38px; height:38px; border-radius:50%;
    background:var(--panel2); color:var(--text);
    border:2px solid #3a4478; font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:.15s;
  }
  .hand-nav:hover { border-color:var(--accent); background:#2a3160; }
  .hand-nav.left  { left:6px; }
  .hand-nav.right { right:6px; }
  .hand-hint { text-align:center; color:var(--muted); font-size:12px; margin-top:2px; }

  /* ---- 2D explore ---- */
  .explore-wrap { text-align:center; }
  #scene { background:#0c0f1c; border:2px solid #2a3160; border-radius:12px; display:block; margin:8px auto; max-width:100%; image-rendering:pixelated; }
  .explore-hint { color:var(--muted); font-size:14px; margin-top:6px; }
  .targets { display:flex; gap:10px; flex-wrap:wrap; }
  .tchip { flex:1 1 130px; min-width:120px; background:var(--panel2); border:2px solid #3a4478; border-radius:10px; padding:8px 10px; cursor:pointer; transition:.15s; font-size:13px; }
  .tchip:hover { border-color:var(--accent); }
  .tchip.sel { border-color:var(--accent2); box-shadow:0 0 8px rgba(255,179,71,.4); }
  .tchip.dead { opacity:.4; cursor:default; text-decoration:line-through; }
  .tchip .tmini { height:6px; margin-top:6px; }

  .btn { display:inline-block; padding:12px 22px; border-radius:10px; border:none; font-size:16px; font-weight:bold; cursor:pointer; background:var(--accent); color:#0c0f1c; transition:.15s; margin:4px; }
  .btn:hover { filter:brightness(1.1); } .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn.diff { background:var(--panel2); color:var(--text); border:2px solid #3a4478; padding:16px 24px; }
  .btn.diff:hover { border-color:var(--accent2); }
  .btn-row { text-align:center; margin-top:14px; }

  .world-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  .world { background:var(--panel2); border:2px solid #3a4478; border-radius:14px; padding:20px; cursor:pointer; transition:.15s; text-align:center; }
  .world:hover { transform:translateY(-4px); border-color:var(--accent); }
  .world .wemoji { font-size:44px; }
  .world .wname { font-size:18px; font-weight:bold; color:var(--accent); margin-top:6px; }
  .world .wdesc { font-size:13px; color:var(--muted); margin-top:4px; }

  .feedback { border-radius:10px; padding:14px; margin-top:14px; line-height:1.5; }
  .feedback.hit { background:#1b3324; border-left:4px solid var(--good); }
  .feedback.miss { background:#3a1e28; border-left:4px solid var(--danger); }
  .feedback .teach { margin-top:10px; font-size:14px; }
  .feedback .teach b { color:var(--accent); }
  .review { margin-top:12px; }
  .review-title { font-size:13px; font-weight:700; color:#ffd27d; margin-bottom:8px; }
  .review-item { border-radius:8px; padding:8px 10px; margin:6px 0; background:rgba(0,0,0,.22); border-left:4px solid #555; }
  .review-item.missed { border-left-color:var(--accent2); }
  .review-item.wrong  { border-left-color:var(--danger); }
  .review-head { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .review-tag { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; padding:2px 6px; border-radius:5px; white-space:nowrap; }
  .review-item.missed .review-tag { color:var(--accent2); background:rgba(199,125,255,.14); }
  .review-item.wrong  .review-tag { color:var(--danger);  background:rgba(255,93,115,.14); }
  .review-opt { font-size:13px; font-weight:600; }
  .review-why { font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.45; }
  .review-perfect { margin-top:10px; font-size:13px; color:var(--good); font-weight:600; }

  .center { text-align:center; } .big { font-size:44px; margin:10px; } .muted { color:var(--muted); }
  .float { animation:bob 2s ease-in-out infinite; } @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .dmg-pop { color:var(--danger); font-weight:bold; font-size:22px; }

  table.lb { width:100%; border-collapse:collapse; margin-top:8px; }
  table.lb th, table.lb td { padding:8px 10px; text-align:left; border-bottom:1px solid #2a3160; font-size:14px; }
  table.lb th { color:var(--accent); }
  table.lb tr.you { background:#23305a; }
  .name-input { padding:10px 12px; border-radius:8px; border:2px solid #3a4478; background:var(--panel2); color:var(--text); font-size:15px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   CODE TOWER — educational card/tower game
   Worlds -> Difficulty -> Draft (rarity cards) -> Fights
   ============================================================ */

// ================= WORLDS & CONTENT =================
// Each world has a set of bosses; each boss has a pool of questions.
const WORLDS = {
  binary: {
    name:"Binary & 2's Complement", emoji:"🔢",
    desc:"Bits, bases, and signed numbers.",
    enemyTypes:[
      { name:"Bit Mite",    emoji:"🪲", hpMult:0.55, dmgMult:0.5 },
      { name:"Byte Imp",    emoji:"👺", hpMult:0.75, dmgMult:0.75 },
      { name:"Nibble Newt", emoji:"🦎", hpMult:0.65, dmgMult:0.6 },
      { name:"Carry Cralwer",emoji:"🕷️", hpMult:0.9,  dmgMult:0.9 },
    ],
    bosses:[
      { name:"Base Gremlin", emoji:"👾", topic:"Binary basics", hp:100, pool:[
        { q:"Select ALL correct conversions.", options:[
            {t:"1010₂ = 10",correct:true},{t:"1111₂ = 15",correct:true},
            {t:"1000₂ = 16",correct:false},{t:"0110₂ = 6",correct:true},
            {t:"1100₂ = 14",correct:false}],
          alt:[{t:"0001₂ = 1",correct:true},{t:"1001₂ = 8",correct:false}],
          teach:"Each bit is a power of 2 (…8,4,2,1). 1010=8+2=10, 1111=15, 1000=8, 0110=6, 1100=12." },
        { q:"Select ALL true statements about binary and place value.", options:[
            {t:"Shifting left by 1 multiplies by 2",correct:true},
            {t:"Shifting right by 1 divides by 2 (integer)",correct:true},
            {t:"n bits represent 2ⁿ distinct values",correct:true},
            {t:"n bits represent up to 2ⁿ (i.e. max value 2ⁿ)",correct:false}],
          teach:"n bits give 2ⁿ patterns, so unsigned range is 0..2ⁿ−1. Left shift ×2, right shift ÷2." },
        { q:"Select ALL correct binary additions.", options:[
            {t:"0011 + 0001 = 0100",correct:true},{t:"0101 + 0011 = 1000",correct:true},
            {t:"0111 + 0001 = 1000",correct:true},{t:"1010 + 0101 = 1110",correct:false},
            {t:"0110 + 0110 = 1000",correct:false}],
          teach:"Add like decimal, carrying at 2. 0011+0001=0100, 0101+0011=1000, 0111+0001=1000, 1010+0101=1111, 0110+0110=1100." },
        { q:"How many values / what range for these bit widths? Select ALL true.", options:[
            {t:"4 bits → 16 values (0..15)",correct:true},
            {t:"8 bits → 256 values (0..255)",correct:true},
            {t:"10 bits → 1024 values",correct:true},
            {t:"16 bits → 32768 values",correct:false}],
          teach:"n bits → 2ⁿ values. 16 bits = 65536 values (0..65535)." },
        { q:"Select ALL correct decimal→binary conversions.", options:[
            {t:"13 = 1101",correct:true},{t:"20 = 10100",correct:true},
            {t:"7 = 0111",correct:true},{t:"9 = 1011",correct:false},
            {t:"18 = 10001",correct:false}],
          teach:"13=8+4+1=1101, 20=16+4=10100, 7=4+2+1=0111, 9=1001, 18=10010." },
        { q:"Select ALL true about even/odd and low bits.", options:[
            {t:"A binary number is even iff its last bit is 0",correct:true},
            {t:"ANDing with 1 tests the least-significant bit",correct:true},
            {t:"Numbers ending in 1 are odd",correct:true},
            {t:"The MSB determines even/odd",correct:false}],
          teach:"The least-significant bit decides parity: 0=even, 1=odd. x & 1 extracts it." },
      ]},
      { name:"Hex Wraith", emoji:"🔮", topic:"Hex & bases", hp:120, pool:[
        { q:"Select ALL correct hex facts.", options:[
            {t:"0xF = 15",correct:true},{t:"0x10 = 16",correct:true},
            {t:"One hex digit = 4 bits (a nibble)",correct:true},
            {t:"0xFF = 256",correct:false},{t:"0xA = 11",correct:false}],
          teach:"Hex digit = 4 bits. 0xF=15, 0x10=16, 0xFF=255, 0xA=10." },
        { q:"0b11010110 — select ALL correct interpretations (unsigned).", options:[
            {t:"= 214",correct:true},{t:"= 0xD6",correct:true},
            {t:"Has 5 bits set",correct:true},{t:"= 0xC6",correct:false}],
          teach:"11010110 = 128+64+16+4+2 = 214 = 0xD6, with five 1-bits." },
        { q:"Select ALL correct hex↔decimal conversions.", options:[
            {t:"0x1F = 31",correct:true},{t:"0x20 = 32",correct:true},
            {t:"0x64 = 100",correct:true},{t:"0x2A = 44",correct:false},
            {t:"0xB = 12",correct:false}],
          teach:"0x1F=31, 0x20=32, 0x64=100, 0x2A=42, 0xB=11." },
        { q:"Select ALL correct binary↔hex groupings (4 bits per hex digit).", options:[
            {t:"1111 0000 = 0xF0",correct:true},{t:"1010 1100 = 0xAC",correct:true},
            {t:"0011 1001 = 0x39",correct:true},{t:"1101 0010 = 0xC2",correct:false}],
          teach:"Group bits in fours: 1111=F,0000=0 → 0xF0; 1010 1100=0xAC; 0011 1001=0x39; 1101 0010=0xD2." },
        { q:"Select ALL true about octal and other bases.", options:[
            {t:"One octal digit = 3 bits",correct:true},
            {t:"0o17 = 15 in decimal",correct:true},
            {t:"Base b uses digits 0..b−1",correct:true},
            {t:"Hex uses digits 0-9 and A-G",correct:false}],
          teach:"Octal digit = 3 bits, 0o17 = 8+7 = 15. Hex letters run A(10)–F(15) only." },
        { q:"0xCAFE — select ALL correct facts.", options:[
            {t:"It fits in 16 bits",correct:true},
            {t:"= 51966 in decimal",correct:true},
            {t:"= 1100 1010 1111 1110 in binary",correct:true},
            {t:"It fits in 8 bits",correct:false}],
          teach:"0xCAFE = 4 hex digits = 16 bits = 51966 = 1100 1010 1111 1110." },
      ]},
      { name:"Two's Complement Titan", emoji:"⚖️", topic:"Signed numbers", hp:150, pool:[
        { q:"Select ALL true statements about two's complement (8-bit).", options:[
            {t:"The MSB acts as the sign bit",correct:true},
            {t:"Range is −128 to 127",correct:true},
            {t:"Negate = invert all bits then add 1",correct:true},
            {t:"There are two representations of zero",correct:false},
            {t:"11111111 = −1",correct:true}],
          alt:[{t:"10000000 = −128",correct:true},{t:"Range is −127 to 128",correct:false}],
          teach:"Two's complement has ONE zero, range −128..127 (8-bit). Negate = invert+1. 11111111 = −1." },
        { q:"To compute −5 in 8-bit two's complement, select ALL correct steps/results.", options:[
            {t:"Start: 00000101 (=5)",correct:true},
            {t:"Invert: 11111010",correct:true},
            {t:"Add 1: 11111011",correct:true},
            {t:"Result equals 0xFB",correct:true},
            {t:"Result equals 0x05",correct:false}],
          teach:"−5: 00000101 → invert 11111010 → +1 = 11111011 = 0xFB." },
        { q:"8-bit two's complement — select ALL correct values.", options:[
            {t:"10000000 = −128",correct:true},{t:"11111110 = −2",correct:true},
            {t:"01111111 = 127",correct:true},{t:"11110000 = −32",correct:false},
            {t:"10000001 = −128",correct:false}],
          teach:"MSB set = negative. 10000000=−128, 11111110=−2, 01111111=127, 11110000=−16, 10000001=−127." },
        { q:"Select ALL true about signed overflow (8-bit two's complement).", options:[
            {t:"127 + 1 wraps to −128",correct:true},
            {t:"Adding two positives can yield a negative (overflow)",correct:true},
            {t:"−128 has no positive counterpart in 8 bits",correct:true},
            {t:"Overflow is impossible in fixed-width ints",correct:false}],
          teach:"Fixed width wraps around: 127+1 = −128. |−128| = 128 can't be stored as +128 in 8 bits." },
        { q:"Select ALL true about sign extension & shifts.", options:[
            {t:"Sign-extending copies the MSB into new high bits",correct:true},
            {t:"Arithmetic right shift preserves the sign bit",correct:true},
            {t:"Logical right shift fills with 0s",correct:true},
            {t:"Sign extension always fills with 0s",correct:false}],
          teach:"Sign extension replicates the sign bit; arithmetic >> keeps sign, logical >> fills zeros." },
        { q:"Select ALL correct binary arithmetic results (8-bit).", min:"medium", options:[
            {t:"0110 1010 + 0001 0110 = 1000 0000",correct:true},
            {t:"1010 & 0110 = 0010",correct:true},
            {t:"1010 | 0101 = 1111",correct:true},
            {t:"1100 ^ 1010 = 0100",correct:false}],
          teach:"106+22=128=1000 0000. AND keeps common 1s (0010), OR unions (1111), 1100 XOR 1010 = 0110." },
        { q:"IEEE-754 single precision — select ALL TRUE.", min:"hard", options:[
            {t:"It uses 1 sign, 8 exponent, and 23 mantissa bits",correct:true},
            {t:"The exponent is stored with a bias of 127",correct:true},
            {t:"There is an implicit leading 1 for normalized values",correct:true},
            {t:"0.1 can be represented exactly",correct:false}],
          teach:"32-bit float = 1+8+23 bits, exponent bias 127, implicit leading 1; 0.1 is not exact in binary." },
      ]},
    ],
  },

  comporg: {
    name:"Computer Organization", emoji:"🔌",
    desc:"Boolean logic and logic gates.",
    enemyTypes:[
      { name:"AND Ant",    emoji:"🐜", hpMult:0.55, dmgMult:0.5 },
      { name:"OR Ogreling",emoji:"👺", hpMult:0.8,  dmgMult:0.8 },
      { name:"NOT Newt",   emoji:"🦎", hpMult:0.7,  dmgMult:0.7 },
      { name:"XOR Xerus",  emoji:"🐿️", hpMult:0.65, dmgMult:0.6 },
    ],
    bosses:[
      { name:"Gate Keeper", emoji:"🚪", topic:"Basic logic gates", hp:100, pool:[
        { q:"Select ALL correct outputs for a 2-input AND gate.", options:[
            {t:"AND(1,1) = 1",correct:true},{t:"AND(1,0) = 0",correct:true},
            {t:"AND(0,0) = 0",correct:true},{t:"AND(1,0) = 1",correct:false},
            {t:"AND(1,1) = 0",correct:false}],
          teach:"AND outputs 1 only when ALL inputs are 1; otherwise 0." },
        { q:"Select ALL correct outputs for a 2-input OR gate.", options:[
            {t:"OR(0,0) = 0",correct:true},{t:"OR(1,0) = 1",correct:true},
            {t:"OR(1,1) = 1",correct:true},{t:"OR(0,0) = 1",correct:false}],
          teach:"OR outputs 1 when at least one input is 1; it is 0 only when all inputs are 0." },
        { q:"Select ALL TRUE about the NOT gate (inverter).", options:[
            {t:"NOT(0) = 1",correct:true},{t:"NOT(1) = 0",correct:true},
            {t:"It has exactly one input",correct:true},{t:"NOT(1) = 1",correct:false}],
          teach:"A NOT gate (inverter) has one input and flips it: 0->1, 1->0." },
        { q:"Select ALL correct outputs for a 2-input XOR gate.", options:[
            {t:"XOR(1,1) = 0",correct:true},{t:"XOR(1,0) = 1",correct:true},
            {t:"XOR(0,0) = 0",correct:true},{t:"XOR outputs 1 when inputs are equal",correct:false}],
          teach:"XOR outputs 1 when inputs DIFFER, 0 when they are equal." },
        { q:"Select ALL TRUE about NAND and NOR gates.", options:[
            {t:"NAND is AND followed by NOT",correct:true},
            {t:"NAND(1,1) = 0",correct:true},
            {t:"NOR(0,0) = 1",correct:true},
            {t:"NOR is OR with no inversion",correct:false}],
          teach:"NAND = NOT(AND), NOR = NOT(OR). NAND(1,1)=0, NOR(0,0)=1." },
      ]},
      { name:"Boolean Baron", emoji:"🎩", topic:"Boolean algebra", hp:130, pool:[
        { q:"Select ALL correct Boolean identities.", options:[
            {t:"A + 0 = A",correct:true},{t:"A · 1 = A",correct:true},
            {t:"A + A' = 1",correct:true},{t:"A · A' = 1",correct:false}],
          teach:"Identity: A+0=A, A·1=A. Complement: A+A'=1, A·A'=0." },
        { q:"Select ALL correct Boolean laws.", options:[

// ================= CARD SYSTEM (rarity based) =================
// Rarity odds scale with floor progress:
//   start (floor 0):    70% common / 20% rare / 10% epic
//   top   (last floor):  50% common / 30% rare / 20% epic
const RARITY_START = { common:70, rare:20, epic:10 };
const RARITY_END   = { common:50, rare:30, epic:20 };

const CARD_DEFS = {
  // --- COMMON ---
  heal20:    { name:"❤️ Patch", rarity:"common", desc:"Restore 20 HP.", },
  shield:    { name:"🛡️ Shield", rarity:"common", desc:"Block ALL damage on your next turn.", },
  evade:     { name:"🌫️ Evasive", rarity:"common", desc:"+ evasiveness for 3 turns (boss more likely to miss).", },
  dmg20:     { name:"⚡ Overclock", rarity:"common", desc:"+20 flat damage on your next answer.", },
  // --- RARE ---
  crit:      { name:"⚔️ Empower", rarity:"rare", desc:"Next answer deals 1.5x damage.", },
  heal40:    { name:"💚 Big Patch", rarity:"rare", desc:"Restore 40 HP.", },
  pick1:     { name:"🔮 Insight", rarity:"rare", desc:"Reveal & auto-pick 1 correct answer.", },
  // --- EPIC ---
  double:    { name:"💥 Double Strike", rarity:"epic", desc:"Next answer deals 2x damage.", },
  aegis:     { name:"🛡️✨ Aegis", rarity:"epic", desc:"Permanent shield (25 HP) — absorbs all damage until depleted; HP never drops from a hit while it holds.", },
  reveal2:   { name:"🧠 Clarity", rarity:"epic", desc:"Delete 1 wrong answer AND auto-pick 1 correct answer.", },
};
const CARDS_BY_RARITY = { common:[], rare:[], epic:[] };
Object.entries(CARD_DEFS).forEach(([id,c]) => CARDS_BY_RARITY[c.rarity].push(id));

// progress: 0 at first floor, 1 at the last floor
function floorProgress() {
  const last = (state.tower ? state.tower.length : 1) - 1;
  if (last <= 0) return 1;
  return Math.min(1, Math.max(0, state.stageIndex / last));
}
function currentRarityWeights() {
  const p = floorProgress();
  const lerp = (a,b)=> a + (b-a)*p;
  return {
    common: lerp(RARITY_START.common, RARITY_END.common),
    rare:   lerp(RARITY_START.rare,   RARITY_END.rare),
    epic:   lerp(RARITY_START.epic,   RARITY_END.epic),
  };
}
function rollRarity() {
  const w = currentRarityWeights();
  const r = Math.random() * (w.common + w.rare + w.epic);
  if (r < w.common) return "common";
  if (r < w.common + w.rare) return "rare";
  return "epic";
}
function rollCard() {
  const rarity = rollRarity();
  const pool = CARDS_BY_RARITY[rarity];
  return pool[Math.floor(Math.random()*pool.length)];
}

// ================= COMBAT TUNING =================
// Max damage a question can deal on this floor (before card multipliers).
// It grows a little per floor so later fights hit harder.
const BASE_MAX_DAMAGE = 60;
// Boss lands its attack 75% of the time regardless of floor/difficulty.
// (Damage amount still scales with difficulty + floor; only the hit CHANCE is flat.)
const BOSS_HIT_CHANCE = 0.75;
function floorMaxDamage() {
  // e.g. floor 1 -> 60, +6 per floor, scaled by difficulty.
  return Math.round((BASE_MAX_DAMAGE + state.stageIndex * 6) * state.diff.dmgMult);
}

// ================= DIFFICULTY =================
const DIFFICULTY = {
  easy:   { label:"Easy",   floors:3, playerHP:120, dmgMult:0.85, bossBase:6,  bossVar:6,  hpMult:0.9, rank:0 },
  medium: { label:"Medium", floors:5, playerHP:100, dmgMult:1.0,  bossBase:9,  bossVar:8,  hpMult:1.0, rank:1 },
  hard:   { label:"Hard",   floors:7, playerHP:85,  dmgMult:1.15, bossBase:12, bossVar:10, hpMult:1.1, rank:2 },
};

// Question difficulty gating: a question tagged with `min:"medium"` or
// `min:"hard"` only appears at that difficulty or above.
const QDIFF_RANK = { easy:0, medium:1, hard:2 };

// ================= STATE =================
let state = { phase:"menu" };

function makeTower(worldKey, floors) {
  const bosses = WORLDS[worldKey].bosses;
  const tower = [];
  for (let i = 0; i < floors; i++) tower.push(bosses[i % bosses.length]);
  return tower;
}

function newGame(worldKey, diffKey) {
  const d = DIFFICULTY[diffKey];
  state = {
    worldKey, world: WORLDS[worldKey],
    diffKey, diff: d,
    tower: makeTower(worldKey, d.floors),
    stageIndex: 0,
    playerHP: d.playerHP, playerMax: d.playerHP,
    room: null, target: 0,
    selected:new Set(), removed:new Set(), revealed:new Set(),
    hand: [],
    // per-turn / timed buffs
    critNext:false, doubleNext:false, dmgBonusNext:0, shieldNext:false,
    evadeTurns:0, aegis:0,   // aegis = permanent shield hitpoints remaining
    lastQ:null, wrongMemory:{}, totalAnswers:0,
    phase:"menu",
  };
}

function currentStage(){ return state.tower[state.stageIndex]; }
function bossFloorScale(){ return 1 + state.stageIndex * 0.12; }

// ======= DRAFT: auto-grant a random 2-4 cards ========
function startDraft() {
  // weighted card count: 2 is most likely, then 3, then 4
  const r = Math.random() * 100;                 // weights 40 / 35 / 25
  const count = r < 40 ? 2 : r < 75 ? 3 : 4;
  const granted = [];
  for (let i = 0; i < count; i++) granted.push(rollCard());
  granted.forEach(id => state.hand.push({ id }));
  state.draftGranted = granted;   // for the reveal screen
  state.phase = "draft";
  render();
}
function continueFromDraft() { beginBattle(); }  // draft -> begin the quiz fight

// ================= STAGE / QUESTION =================
// Begin the quiz battle inside the (already-built) room.
function beginBattle() {
  state.target = firstAliveIndex();
  pickQuestion();
  state.phase = "answering";
  render();
}
function firstAliveIndex() {
  const es = state.room ? state.room.enemies : [];
  const i = es.findIndex(e => e.alive);
  return i < 0 ? 0 : i;
}
function aliveEnemies() { return state.room ? state.room.enemies.filter(e=>e.alive) : []; }
function targetEnemy() { return state.room ? state.room.enemies[state.target] : null; }

function pickQuestion() {
  const s = currentStage();
  const rank = QDIFF_RANK[state.diffKey] || 0;
  // Only include questions whose minimum difficulty is unlocked at this level.
  let pool = s.pool.map((_,i)=>i).filter(i => (QDIFF_RANK[s.pool[i].min] || 0) <= rank);
  if (!pool.length) pool = s.pool.map((_,i)=>i);
  let choices = pool.slice();
  if (choices.length > 1 && state.lastQ != null) choices = choices.filter(i=>i!==state.lastQ);
  if (!choices.length) choices = pool.slice();
  const idx = choices[Math.floor(Math.random()*choices.length)];
  state.lastQ = idx;

  const base = s.pool[idx];
  let opts = base.options.map(o=>({...o}));
  const key = state.stageIndex + "|" + base.q;
  if (state.wrongMemory[key] && base.alt && base.alt.length) {
    const altCopy = base.alt.map(o=>({...o}));
    opts = shuffle(opts).slice(0, Math.max(3, opts.length - altCopy.length)).concat(altCopy);
  }
  opts = shuffle(opts);
  state.currentQ = { q: base.q, code: base.code, options: opts, teach: base.teach, key };
  state.selected=new Set(); state.removed=new Set(); state.revealed=new Set();
}
function currentQuestion(){ return state.currentQ; }

// ================= CARDS =================
function useCard(idx) {
  if (state.phase !== "answering") return;
  const card = state.hand[idx];
  if (!card) return;
  const q = currentQuestion();
  const id = card.id;

  switch(id) {
    case "heal20": state.playerHP = Math.min(state.playerMax, state.playerHP+20); break;
    case "heal40": state.playerHP = Math.min(state.playerMax, state.playerHP+40); break;
    case "shield": state.shieldNext = true; break;
    case "evade":  state.evadeTurns = 3; break;
    case "dmg20":  state.dmgBonusNext += 20; break;
    case "crit":   state.critNext = true; break;
    case "double": state.doubleNext = true; break;
    case "aegis":  state.aegis = 25; break;
    case "pick1":  autoPickCorrect(q, 1); break;
    case "reveal2": deleteWrong(q, 1); autoPickCorrect(q, 1); break;
  }
  state.hand.splice(idx, 1);   // consumed card disappears from the hand
  render();
}
function autoPickCorrect(q, n) {
  const right = q.options.map((o,i)=>i).filter(i=>q.options[i].correct && !state.selected.has(i));
  shuffle(right).slice(0,n).forEach(i=>{ state.selected.add(i); state.revealed.add(i); });
}
function deleteWrong(q, n) {
  const wrong = q.options.map((o,i)=>i).filter(i=>!q.options[i].correct && !state.removed.has(i));
  shuffle(wrong).slice(0,n).forEach(i=>state.removed.add(i));
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function toggleOption(i){
  if (state.phase !== "answering") return;
  if (state.removed.has(i)) return;
  if (state.selected.has(i)) state.selected.delete(i); else state.selected.add(i);
  render();
}

// ================= COMBAT =================
function submitAnswer() {
  if (state.phase !== "answering") return;
  const q = currentQuestion();
  state.totalAnswers++;
  const totalCorrect = q.options.filter(o=>o.correct).length;

  let hits=0, wrongPicks=0;
  q.options.forEach((o,i)=>{ if (state.selected.has(i)) o.correct?hits++:wrongPicks++; });

  // ----- DAMAGE MODEL (per-choice decisions) -----
  // Every answer choice handled correctly earns an equal share of the floor's
  // max damage:  correctly SELECTING a correct option, OR correctly LEAVING an
  // incorrect option unselected. Wrong selections and missed correct answers
  // simply earn nothing (they don't subtract from the earned amount).
  //
  // Example: floor max 60, 5 choices (2 correct). Only right picks = 5/5 -> 60.
  // Pick 1 correct + 1 incorrect: 1 correct-selected + 2 correct-left = 3 good
  // decisions -> 60 * (3/5) = 36 damage.
  const totalChoices = q.options.length;
  let correctDecisions = 0;
  q.options.forEach((o,i) => {
    const picked = state.selected.has(i);
    if (o.correct && picked) correctDecisions++;          // right: selected a correct
    else if (!o.correct && !picked) correctDecisions++;   // right: left an incorrect alone
  });
  const maxDamage = floorMaxDamage();
  const fraction = totalChoices > 0 ? correctDecisions / totalChoices : 0;
  // score = share of the correct answers actually found (boss counter / feedback)
  let score = totalCorrect > 0 ? Math.max(0, Math.min(1, hits/totalCorrect)) : (wrongPicks===0 ? 1 : 0);
  if (hits < totalCorrect || wrongPicks > 0) state.wrongMemory[q.key] = true;

  let dmg = Math.round(maxDamage * fraction);
  dmg += state.dmgBonusNext; state.dmgBonusNext = 0;
  if (state.critNext)   { dmg = Math.round(dmg*1.5); state.critNext=false; }
  if (state.doubleNext) { dmg = Math.round(dmg*2);   state.doubleNext=false; }
  dmg = Math.max(0, dmg);

  // ----- DEAL DAMAGE TO THE TARGET -----
  const tgt = targetEnemy();
  let killedName = null;
  if (tgt && tgt.alive) {
    tgt.hp = Math.max(0, tgt.hp - dmg);
    tgt.hitFlash = 8;
    if (tgt.hp === 0) { tgt.alive = false; killedName = tgt.name; }
  }

  // ----- ENEMIES STRIKE BACK -----
  // Every still-living enemy takes a swing. Weak enemies hit for less; the boss
  // (with a higher dmgMult) hits much harder. Shield / Aegis apply to the total.
  const scale = bossFloorScale();
  const attacks = [];
  let incoming = 0;
  aliveEnemies().forEach(e => {
    let hitChance = BOSS_HIT_CHANCE;
    if (state.evadeTurns > 0) hitChance = Math.max(0.15, hitChance - 0.30);
    if (Math.random() > hitChance) { attacks.push({ name:e.name, missed:true, dmg:0 }); return; }
    let raw = state.diff.bossBase*scale + Math.floor(Math.random()*(state.diff.bossVar*scale));
    raw = Math.round(raw * e.dmgMult * (1 + (1-score)*0.4));
    incoming += raw;
    attacks.push({ name:e.name, missed:false, dmg:raw, enemy:e });
  });

  // ----- ATTACK ANIMATIONS (the only time icons move) -----
  if (state.room) {
    const pl = state.room.player;
    if (tgt && dmg > 0) startLunge(pl, tgt.x, tgt.y);   // player strikes target
    let delay = 20;
    attacks.forEach(a => {
      if (!a.missed && a.enemy) { startLunge(a.enemy, pl.x, pl.y, delay); delay += 8; }
    });
  }

  const boss = { attacked: attacks.length>0, blocked:false, aegisAbsorb:0, dmg:0, attacks };
  if (state.shieldNext) { boss.blocked = true; incoming = 0; }
  else if (state.aegis > 0 && incoming > 0) {
    const absorbed = Math.min(incoming, state.aegis);
    boss.aegisAbsorb = absorbed;
    state.aegis -= absorbed;
    incoming -= absorbed;
  }
  boss.dmg = incoming;
  state.playerHP = Math.max(0, state.playerHP - incoming);

  state.shieldNext = false;
  if (state.evadeTurns > 0) state.evadeTurns--;

  // retarget if the current target just died
  if (!targetEnemy() || !targetEnemy().alive) state.target = firstAliveIndex();

  // ----- PER-OPTION REVIEW -----
  // For every option the player mishandled, record WHY so they can learn it and
  // answer faster next time: a wrongly-checked option (it was false) or a missed
  // correct option (it was true but left unselected).
  const mistakes = [];
  q.options.forEach((o,i) => {
    const picked = state.selected.has(i);
    if (o.correct && !picked) {
      mistakes.push({ text:o.t, kind:"missed",
        why: o.why || "This statement is TRUE, so it should have been selected." });
    } else if (!o.correct && picked) {
      mistakes.push({ text:o.t, kind:"wrong",
        why: o.why || "This statement is FALSE, so it should have been left unselected." });
    }
  });

  const cleared = aliveEnemies().length === 0;
  state.lastResult = { hits, wrongPicks, totalCorrect, correctDecisions, totalChoices, maxDamage, score, dmg, boss, teach:q.teach, mistakes, killedName, targetName: tgt?tgt.name:"" };
  state.phase = "resolved";
  if (state.playerHP <= 0) state.phase = "lost";
  else if (cleared) { state.room.cleared = true; state.phase = "roomclear"; }
  render();
}

function nextAfterResolve() {
  // Enemies remain: ask the next question, keeping the current target.
  state.target = firstAliveIndex();
  pickQuestion();
  state.phase = "answering";
  render();
}

// Room cleared: walk through the open door to the next floor (or win).
function advanceFloor() {
  stopScene();
  if (state.stageIndex >= state.tower.length - 1) { finishGame(true); return; }
  state.stageIndex++;
  enterRoom();
}

// Let the player pick which enemy to attack (only while answering).
function setTarget(i) {
  if (state.phase !== "answering") return;
  const e = state.room.enemies[i];
  if (!e || !e.alive) return;
  state.target = i;
  render();
}
function finishGame(won){ state.won = won; state.phase = won?"victory":"lost"; render(); }

// ================= LEADERBOARD =================
const LB_KEY = "codeTowerLeaderboard_v3";
function loadLB(){ try { return JSON.parse(localStorage.getItem(LB_KEY))||[]; } catch(e){ return []; } }
function saveLB(l){ localStorage.setItem(LB_KEY, JSON.stringify(l)); }

function submitScore(name) {
  const entry = {
    name:(name||"Anon").slice(0,16),
    world: state.world.name,
    floor: state.stageIndex + (state.won?1:0),
    totalFloors: state.tower.length,
    completed: !!state.won,
    answers: state.totalAnswers,
    difficulty: state.diff.label,
    when: Date.now(),
  };
  const lb = loadLB(); lb.push(entry);
  lb.sort((a,b)=>{
    if (a.completed!==b.completed) return a.completed?-1:1;
    if (a.completed && b.completed) return a.answers-b.answers;
    if (b.floor!==a.floor) return b.floor-a.floor;
    return a.answers-b.answers;
  });
  saveLB(lb.slice(0,60));
  state.myEntryWhen = entry.when;
  state.phase = "leaderboard";
  render();
}

// ============================= 2D SCENE =============================
const SCENE_W = 640, SCENE_H = 360;
let explore = { raf:0, ctx:null, canvas:null, clickHandler:null };

// Build the enemies for the current floor and set up a fresh room.
// Non-final floors: 2–4 random weaker enemies (varied HP & damage).
// Final floor: a single boss with much more HP and damage.
function buildRoom() {
  const stage = currentStage();
  const scale = bossFloorScale();
  const isFinal = state.stageIndex >= state.tower.length - 1;
  const enemies = [];

  if (isFinal) {
    enemies.push({
      name: stage.name, emoji: stage.emoji, isBoss: true,
      maxHp: Math.max(1, Math.round(stage.hp * state.diff.hpMult * scale * 1.7)),
      dmgMult: 1.8, size: 46,
    });
  } else {
    const types = state.world.enemyTypes;
    const count = 2 + Math.floor(Math.random() * 3); // 2..4 weak enemies
    for (let i = 0; i < count; i++) {
      const t = types[Math.floor(Math.random() * types.length)];
      enemies.push({
        name: t.name, emoji: t.emoji, isBoss: false,
        maxHp: Math.max(1, Math.round(stage.hp * state.diff.hpMult * scale * t.hpMult)),
        dmgMult: t.dmgMult, size: 34,
      });
    }
  }

  // finalize + place enemies around the centre-right of the room
  const n = enemies.length;
  enemies.forEach((e, i) => {
    e.hp = e.maxHp; e.alive = true; e.bob = Math.random() * Math.PI * 2; e.hitFlash = 0;
    if (e.isBoss || n === 1) { e.x = SCENE_W * 0.6; e.y = SCENE_H / 2; }
    else {
      const ang = (i / n) * Math.PI * 2;
      e.x = SCENE_W * 0.6 + Math.cos(ang) * 78;
      e.y = SCENE_H / 2 + Math.sin(ang) * 70;
    }
  });

  state.room = {
    cleared: false,
    player: { x: 90, y: SCENE_H/2, r: 14, dir: 1, t: Math.random()*Math.PI*2 },
    enemies,
    door: { x: SCENE_W - 46, y: SCENE_H/2, w: 34, h: 74 },
  };
}

// Enter a floor: build the room, then draft cards, then the battle begins.
function enterRoom() {
  buildRoom();
  startDraft();
}

function stopScene() {
  if (explore.raf) { cancelAnimationFrame(explore.raf); explore.raf = 0; }
  if (explore.clickHandler && explore.canvas) {
    explore.canvas.removeEventListener("click", explore.clickHandler);
  }
  explore.clickHandler = null; explore.canvas = null;
}
// kept for backward-compatible calls from render()
function stopExplore() { stopScene(); }

// Start (or restart) the animated scene for the given canvas element.
function startScene(canvas) {
  explore.canvas = canvas;
  explore.ctx = canvas.getContext("2d");
  // click an enemy on the canvas to target it
  explore.clickHandler = (ev) => {
    if (state.phase !== "answering") return;
    const rect = canvas.getBoundingClientRect();
    const mx = (ev.clientX - rect.left) * (canvas.width / rect.width);
    const my = (ev.clientY - rect.top) * (canvas.height / rect.height);
    let best = -1, bestD = 1e9;
    state.room.enemies.forEach((e, i) => {
      if (!e.alive) return;
      const d = Math.hypot(mx - e.x, my - e.y);
      if (d < e.size && d < bestD) { bestD = d; best = i; }
    });
    if (best >= 0) setTarget(best);
  };
  canvas.addEventListener("click", explore.clickHandler);
  sceneLoop();
}

function sceneLoop() {
  updateScene();
  drawScene();
  explore.raf = requestAnimationFrame(sceneLoop);
}

// A lunge is a quick out-and-back dash toward a point (an attack animation).
// Nothing on the field moves unless it's attacking or being sent one.
function startLunge(e, tx, ty, delay = 0) {
  e.lunge = { homeX: e.x, homeY: e.y, tx, ty, phase: 0, delay };
  if (state.room && e === state.room.player && Math.abs(tx - e.x) > 1) {
    e.dir = tx > e.x ? 1 : -1;
  }
}
function stepLunge(e) {
  const L = e.lunge; if (!L) return;
  if (L.delay > 0) { L.delay--; return; }
  L.phase += 0.07;
  const k = L.phase <= 1 ? L.phase : 2 - L.phase;   // 0 -> 1 -> 0 triangle
  const px = L.homeX + (L.tx - L.homeX) * 0.55;
  const py = L.homeY + (L.ty - L.homeY) * 0.55;
  e.x = L.homeX + (px - L.homeX) * k;
  e.y = L.homeY + (py - L.homeY) * k;
  if (L.phase >= 2) { e.x = L.homeX; e.y = L.homeY; e.lunge = null; }
}

// The player sits still on the left side of the field and only moves to
// throw an attack. Enemies stay put unless they are striking (or hit).
function updateScene() {
  const r = state.room; if (!r) return;
  const p = r.player;

  if (r.cleared && !p.lunge) {
    // stroll toward the open door once the room is won
    const gx = r.door.x - 40, gy = r.door.y;
    const dx = gx - p.x, dy = gy - p.y;
    const dist = Math.hypot(dx, dy) || 1;
    if (dist > 1) {
      const speed = Math.min(2.2, dist);
      p.x += (dx/dist) * speed;
      p.y += (dy/dist) * speed;
      if (Math.abs(dx) > 1) p.dir = dx > 0 ? 1 : -1;
    }
  } else {
    stepLunge(p);
  }

  r.enemies.forEach(e => { if (e.hitFlash > 0) e.hitFlash--; stepLunge(e); });
}

function drawScene() {
  const ctx = explore.ctx; if (!ctx) return;
  const r = state.room; if (!r) return;
  const p = r.player;

  // floor
  ctx.fillStyle = "#141a30";
  ctx.fillRect(0,0,SCENE_W,SCENE_H);
  ctx.strokeStyle = "#1e2748"; ctx.lineWidth = 1;
  for (let x=0; x<=SCENE_W; x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,SCENE_H); ctx.stroke(); }
  for (let y=0; y<=SCENE_H; y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(SCENE_W,y); ctx.stroke(); }
  // walls
  ctx.fillStyle = "#2a3160";
  ctx.fillRect(0,0,SCENE_W,14); ctx.fillRect(0,SCENE_H-14,SCENE_W,14);
  ctx.fillRect(0,0,14,SCENE_H); ctx.fillRect(SCENE_W-14,0,14,SCENE_H);

  // door
  const d = r.door;
  ctx.fillStyle = r.cleared ? "#2b5a34" : "#5a2b2b";
  ctx.fillRect(d.x, d.y - d.h/2, d.w, d.h);
  ctx.strokeStyle = r.cleared ? "#6bd968" : "#ff5d73";
  ctx.lineWidth = 3;
  ctx.strokeRect(d.x, d.y - d.h/2, d.w, d.h);
  ctx.fillStyle = r.cleared ? "#6bd968" : "#ff5d73";
  ctx.font = "20px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(r.cleared ? "🔓" : "🔒", d.x + d.w/2, d.y);

  // enemies
  r.enemies.forEach((e, i) => {
    if (!e.alive) return;
    const oy = 0;  // enemies stay still except when attacking / hit
    const isTarget = (i === state.target) && !r.cleared;
    // target reticle
    if (isTarget) {
      ctx.strokeStyle = "#ffb347"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y + oy, e.size*0.7, 0, Math.PI*2); ctx.stroke();
    }
    // hit flash tint
    ctx.save();
    if (e.hitFlash > 0) ctx.globalAlpha = 0.55 + 0.45*Math.sin(e.hitFlash);
    ctx.font = e.size + "px sans-serif";
    ctx.fillText(e.emoji, e.x, e.y + oy);
    ctx.restore();
    // nameplate
    ctx.fillStyle = isTarget ? "#ffb347" : "#e8ecff";
    ctx.font = "11px sans-serif";
    ctx.fillText((e.isBoss?"👑 ":"") + e.name, e.x, e.y - e.size*0.6 - 12 + oy);
    // mini HP bar
    const bw = Math.max(34, e.size), bx = e.x - bw/2, by = e.y - e.size*0.6 - 6 + oy;
    ctx.fillStyle = "#0c0f1c"; ctx.fillRect(bx, by, bw, 5);
    ctx.fillStyle = e.isBoss ? "#c77dff" : "#ff5d73";
    ctx.fillRect(bx, by, bw * (e.hp/e.maxHp), 5);
  });

  // player shadow + sprite
  ctx.fillStyle = "rgba(0,0,0,.3)";
  ctx.beginPath(); ctx.ellipse(p.x, p.y + 16, 12, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.font = "30px sans-serif";
  ctx.save();
  if (p.dir < 0) { ctx.translate(p.x, p.y); ctx.scale(-1,1); ctx.fillText("🧑", 0, 0); }
  else { ctx.fillText("🧑", p.x, p.y); }
  ctx.restore();

  ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";
}

// ============================= RENDER =============================
const app = document.getElementById("app");
function render() {
  stopScene();  // stop any running scene loop before drawing a new screen
  switch(state.phase) {
    case "menu":        return renderMenu();
    case "difficulty":  return renderDifficulty();
    case "draft":       return renderDraft();
    case "roomclear":   return renderRoomClear();
    case "victory":     return renderEnd(true);
    case "lost":        return renderEnd(false);
    case "leaderboard": return renderLeaderboard();
    default:            return renderFight();
  }
}

    return `<div class="tchip${sel}" ${click}>
      <span>${e.isBoss?"👑 ":""}${e.emoji} ${e.name}</span>
      <div class="bar enemy-bar tmini"><span style="width:${100*e.hp/e.maxHp}%"></span></div>
    </div>`;
  }).join("");
}

function questionText(q) {
  if (q.code) {
    const parts = q.q.split("\n\n");

  }

function statusFlags() {
  const f=[];
  if (state.critNext) f.push("⚔️1.5x");
  if (state.doubleNext) f.push("💥2x");
  if (state.dmgBonusNext) f.push("⚡+"+state.dmgBonusNext);
  if (state.shieldNext) f.push('<span class="shield-tag">🛡️Shield</span>');
  if (state.aegis>0) f.push('<span class="shield-tag">🛡️✨Aegis '+state.aegis+'</span>');
  if (state.evadeTurns>0) f.push("🌫️Evade "+state.evadeTurns);
  return f.length ? "· "+f.join(" ") : "";
}

function renderOption(o,i) {
  if (state.removed.has(i))
    return `<div class="opt" style="opacity:.25;text-decoration:line-through;cursor:default">${escapeHtml(o.t)}</div>`;
  let cls = "opt";
  if (state.phase === "answering") {
    if (state.selected.has(i)) cls += " selected";
    if (state.revealed.has(i)) cls += " correct";
  } else {
    if (o.correct && state.selected.has(i)) cls += " correct";
    else if (!o.correct && state.selected.has(i)) cls += " wrong";
    else if (o.correct && !state.selected.has(i)) cls += " missed";
  }
  const click = state.phase==="answering" ? `onclick="toggleOption(${i})"` : "";
  return `<button class="${cls}" ${click}>${escapeHtml(o.t)}</button>`;
}

// Render the hand as a fanned arc, as if held by an invisible hand below.
// Use the ◀ ▶ arrows (or keyboard) to bring a card to the front so it's
// easy to pick out even when the hand is large and the cards overlap.
function renderHand() {
  const n = state.hand.length;
  if (!n) return '<div class="hand-empty">No cards in hand.</div>';

  if (state.handFocus == null || state.handFocus >= n) state.handFocus = n - 1;
  if (state.handFocus < 0) state.handFocus = 0;
  const focus = state.handFocus;

  const spread = 14;                 // degrees between adjacent cards
  const startAngle = -((n - 1) / 2) * spread;
  const lift = 90;                   // px of vertical arc curvature

  const cards = state.hand.map((c, i) => {
    const def = CARD_DEFS[c.id];
    const angle = startAngle + i * spread;
    // horizontal fan: push cards left/right (wider spacing = easier to grab);
    // vertical: dip toward the ends. Cards only rise on hover (CSS), never stay up.
    const x = angle * 7.6;
    const y = Math.abs(angle) * (lift / 90) * 0.9;   // ends sit slightly lower
    const z = i;
    // the keyboard-focused card just gets a subtle glow — it does NOT lift
    const extra = (i === focus)
      ? "box-shadow:0 10px 22px rgba(0,0,0,.45), 0 0 12px var(--accent);"
      : "";
    const vars = `--tx:${x}px; --ty:${y}px; --rot:${angle}deg;`;
    return `<div class="hand-card ${def.rarity}${i===focus?' focused':''}" style="${vars} z-index:${z}; ${extra}"
                 title="${escapeHtml(def.desc)}" onclick="useCard(${i})">
      <div class="rarity">${def.rarity}</div>
      <div class="cname">${def.name}</div>
      <div class="cdesc">${def.desc}</div>
    </div>`;
  }).join("");

  const nav = n > 1 ? `
    <button class="hand-nav left"  onclick="handNav(-1)" title="Previous card">◀</button>
    <button class="hand-nav right" onclick="handNav(1)"  title="Next card">▶</button>` : "";

  const hint = n > 1
    ? `hover a card to enlarge it · ◀ ▶ keys to browse · ${focus+1}/${n}`
    : `hover then click the card to play`;

  return `<div class="hand-fan">${nav}${cards}</div><div class="hand-hint">${hint}</div>`;
}

// Cycle the focused (front) card left/right.
function handNav(d) {
  const n = state.hand.length; if (!n) return;
  state.handFocus = (((state.handFocus || 0) + d) % n + n) % n;
  render();
}

function renderFeedback() {
  const r = state.lastResult;
  const good = r.score >= 0.75;
  const perfect = r.correctDecisions === r.totalChoices;
  let msg;
  if (r.dmg === 0) msg = "❌ No damage this turn!";
  else if (perfect) msg = "🌟 Perfect answer! Full damage!";
  else if (good) msg = "✅ Strong answer!";
  else msg = "⚠️ Partial answer.";

  const b = r.boss;
  const hitCount = b.attacks ? b.attacks.filter(a=>!a.missed).length : 0;
  const missCount = b.attacks ? b.attacks.filter(a=>a.missed).length : 0;
  let bossLine = "";
  if (b.attacked) {
    if (b.blocked) bossLine = "🛡️ Shield blocked all incoming attacks!";
    else if (b.dmg === 0 && b.aegisAbsorb) bossLine = `🛡️✨ Aegis absorbed <b>${b.aegisAbsorb}</b> (no HP lost). Aegis left: ${state.aegis}`;
    else if (b.dmg === 0 && hitCount === 0) bossLine = `💨 Every enemy <b>missed</b>!`;
    else {
      bossLine = `${hitCount} enem${hitCount===1?"y":"ies"} struck you for <b>${b.dmg}</b>`;
      if (b.aegisAbsorb) bossLine += ` (🛡️✨ Aegis absorbed ${b.aegisAbsorb})`;
      if (missCount) bossLine += ` · ${missCount} missed`;
      bossLine += ".";
    }
  }
  const killLine = r.killedName ? `💀 You defeated <b>${escapeHtml(r.killedName)}</b>!` : "";

  return `
    <div class="feedback ${good?"hit":"miss"}">
      <div><b>${msg}</b></div>
      <div>You got <b>${r.hits}/${r.totalCorrect}</b> correct${r.wrongPicks?`, with <b>${r.wrongPicks}</b> wrong pick(s)`:""}.</div>
      <div>Damage to ${escapeHtml(r.targetName)}: <span class="dmg-pop">${r.dmg}</span>${killLine?"&nbsp;|&nbsp; "+killLine:""}</div>
      ${bossLine?`<div>${bossLine}</div>`:""}
      ${(r.mistakes && r.mistakes.length) ? `
      <div class="review">
        <div class="review-title">📝 Fix these to answer faster next time:</div>
        ${r.mistakes.map(m=>`
          <div class="review-item ${m.kind}">
            <div class="review-head">
              <span class="review-tag">${m.kind==="missed"?"✔ Missed correct":"✘ Wrong pick"}</span>
              <span class="review-opt">${escapeHtml(m.text)}</span>
            </div>
            <div class="review-why">${m.why}</div>
          </div>`).join("")}
      </div>` : `<div class="review-perfect">✅ Every option handled correctly — nice and fast!</div>`}
      <div class="teach">📘 <b>Learn:</b> ${r.teach}</div>
    </div>
    <div class="btn-row">
      <button class="btn" onclick="nextAfterResolve()">➡️ Next Question</button>
    </div>
  `;
}

function renderEnd(won) {
  app.innerHTML = `
    <h1>${state.world.emoji} ${state.world.name}</h1>
    <div class="panel center">
      <div class="big">${won?"🏆👑":"💀"}</div>
      <h2>${won?"You conquered the tower!":"You fell on floor "+(state.stageIndex+1)+"."}</h2>
      <p class="muted">${won
        ? `Cleared all ${state.tower.length} floors on ${state.diff.label} in ${state.totalAnswers} answers.`
        : `Reached floor ${state.stageIndex+1} of ${state.tower.length} on ${state.diff.label}.`}</p>
      <div style="margin:14px 0"><input class="name-input" id="pname" placeholder="Enter your name" maxlength="16" /></div>
      <div class="btn-row">
        <button class="btn" onclick="submitScore(document.getElementById('pname').value)">📝 Submit Score</button>
        <button class="btn diff" onclick="state.phase='menu'; render();">🏠 Menu (skip)</button>
      </div>
    </div>
  `;
}

function renderLeaderboard() {
  app.innerHTML = `
    <h1>🏆 Leaderboard</h1>
    <div class="panel">${lbTable(loadLB(), state.myEntryWhen)}</div>
    <div class="btn-row"><button class="btn" onclick="state.phase='menu'; render();">🏠 Main Menu</button></div>
  `;
}

function lbTable(lb, highlightWhen) {
  if (!lb.length) return `<p class="muted">No scores yet — be the first to climb!</p>`;
  const rows = lb.slice(0,15).map((e,i)=>{
    const crown = e.completed ? "👑" : "";
    const you = highlightWhen && e.when===highlightWhen ? "you" : "";
    const prog = e.completed ? `Cleared (${e.totalFloors})` : `Floor ${e.floor}/${e.totalFloors}`;
    return `<tr class="${you}">
      <td>${i+1}</td><td>${crown} ${escapeHtml(e.name)}</td>
      <td>${escapeHtml(e.world||"—")}</td><td>${e.difficulty}</td>
      <td>${prog}</td><td>${e.answers}</td></tr>`;
  }).join("");
  return `<table class="lb">
    <tr><th>#</th><th>Name</th><th>World</th><th>Difficulty</th><th>Progress</th><th>Answers</th></tr>
    ${rows}</table>`;
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// ---- exit to main menu (with confirm to avoid accidental resets) ----
function exitToMenu() {
  if (confirm("Exit to the main menu? Your current run will be lost.")) {
    state = { phase:"menu" };
    render();
  }
}

// ---- keyboard: browse & play the hand during a fight ----
document.addEventListener("keydown", (e) => {
  if (state.phase !== "answering" || !state.hand || !state.hand.length) return;
  if (e.key === "ArrowLeft")  { handNav(-1); e.preventDefault(); }
  else if (e.key === "ArrowRight") { handNav(1); e.preventDefault(); }
  else if (e.key === "Enter" || e.key === " ") {
    const i = state.handFocus || 0;
    if (state.hand[i]) { useCard(i); e.preventDefault(); }
  }
});

// ---- boot ----
state.phase = "menu";
render();
</script>
</body>
</html>
